name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or commit to build (empty = the branch selected in "Use workflow from")'
        required: false
        default: ''

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup local.properties
        uses: ./.github/actions/setup-local-properties
        with:
          backend_url: ${{ secrets.BACKEND_URL_PROD }}
          google_server_client_id: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      # Without this every run signs with a freshly generated debug keystore, so each APK has a
      # different SHA-1 that is not registered as an Android OAuth client in Google Cloud and
      # Google sign in fails. The secret must be a debug keystore with AGP's default passwords and
      # alias ("android" / "androiddebugkey"); composeApp/build.gradle.kts picks it up through
      # DEBUG_KEYSTORE_PATH. Writing it to ~/.android is not enough: AGP reads its user home from
      # ANDROID_USER_HOME, which the runner points somewhere else.
      - name: Install shared debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::DEBUG_KEYSTORE secret is not set; the APK would be signed with a random key and Google sign in would not work"
            exit 1
          fi
          keystore="$RUNNER_TEMP/debug.keystore"
          echo "$DEBUG_KEYSTORE" | base64 --decode > "$keystore"
          echo "DEBUG_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:"
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug
      - name: Check APK signature
        run: |
          expected=$(keytool -list -v -keystore "$DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA1: //p' | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in composeApp/build/outputs/apk/debug/*.apk; do
            actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-1 digest: //p' | head -1)
            echo "$apk SHA-1: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is signed with $actual, not the shared debug keystore ($expected)"
              exit 1
            fi
          done
      - name: Name artifact
        id: name
        env:
          REF_NAME: ${{ inputs.branch || github.ref_name }}
        run: echo "value=budgethunter-${REF_NAME//\//-}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
