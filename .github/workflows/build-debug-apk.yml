name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or commit to build (empty = the branch selected in "Use workflow from")'
        required: false
        default: ''

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Setup local.properties
        uses: ./.github/actions/setup-local-properties
        with:
          backend_url: ${{ secrets.BACKEND_URL_PROD }}
          google_server_client_id: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      # Without this the runner generates a fresh debug keystore on every run, so each APK has a
      # different SHA-1 that is not registered as an Android OAuth client in Google Cloud and
      # Google sign in fails. AGP signs debug builds with ~/.android/debug.keystore (store and key
      # password "android", alias "androiddebugkey"), so the secret must be such a keystore.
      - name: Install shared debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::DEBUG_KEYSTORE secret is not set; the APK would be signed with a random key and Google sign in would not work"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:"
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug
      - name: Name artifact
        id: name
        env:
          REF_NAME: ${{ inputs.branch || github.ref_name }}
        run: echo "value=budgethunter-${REF_NAME//\//-}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
