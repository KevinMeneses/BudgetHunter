name: Setup local.properties
description: Creates local.properties with required build secrets

inputs:
  backend_url:
    description: Backend URL to write to local.properties
    required: true
  google_server_client_id:
    description: Google OAuth web client id, used as serverClientId for Sign in with Google
    required: false
    default: ''
  revenuecat_android_api_key:
    description: RevenueCat public Android key (goog_...); empty builds an app that cannot sell premium
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create local.properties
      shell: bash
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "BACKEND_URL=${{ inputs.backend_url }}" >> local.properties
        echo "GOOGLE_SERVER_CLIENT_ID=${{ inputs.google_server_client_id }}" >> local.properties
        echo "REVENUECAT_ANDROID_API_KEY=${{ inputs.revenuecat_android_api_key }}" >> local.properties
