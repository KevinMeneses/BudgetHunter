name: Setup local.properties
description: Creates local.properties with required build secrets

inputs:
  backend_url:
    description: Backend URL to write to local.properties
    required: true
  gemini_api_key:
    description: Gemini API key (required for release builds)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create local.properties
      shell: bash
      run: |
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        echo "BACKEND_URL=${{ inputs.backend_url }}" >> local.properties
        echo "GEMINI_API_KEY=${{ inputs.gemini_api_key }}" >> local.properties
